<!DOCTYPE html>

             * - ch7 코드 엔진과 달리 ch8·ch9는 ANALYZING / TECH / MARKET 등이 STRATEGIC 신호 역할
             * - COMPLETED 시 미확정이면 sawStrategicSignal 없으면 SIMPLE 로 표시

             * ✔ onopen + 1초 타임아웃: send()에서 fetch 전에 호출되어 채널 준비를 기다림

             * ✔ 서버에서 오는 데이터를 chunk 단위로 출력
             */
            responseDisplay:async function(targetId, response) {

    <div class="col-sm-10">

        <div class="container py-5">
            <div class="row d-flex justify-content-center">

</html>
