<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">



<th:block>
    <script>

        /**
         * multi_llm_stream 객체
         * ============================================================
         * ✔ 목적
         *   - Multi LLM(OpenAI, Gemini, Llama) 요청을 스트리밍 방식으로 처리
         *   - 서버에서 전달되는 데이터를 "조각(chunk)" 단위로 실시간 출력
         *
         * ✔ 일반 호출과의 차이
         *   - 기존: response.text() → 응답 완료 후 한 번에 출력
         *   - 현재: response.body.getReader() → 데이터가 도착하는 즉시 출력
         *
         * ✔ 학습 포인트
         *   1) fetch + Streaming 응답 처리
         *   2) ReadableStream 사용법
         *   3) TextDecoder 활용
         *   4) Reactive UI 구성
         */

        multi_llm_stream = {

            // 스트리밍 전용 서버 엔드포인트
            url:'/ch1/multi_llm_stream',

            /**
             * 초기화 함수
             * --------------------------------------------------
             * ✔ 버튼 이벤트 등록
             * ✔ 초기 스피너 숨김 처리
             */
            init:function(){
                document.querySelector("#send_btn").addEventListener("click", ()=>{
                    this.send();
                })
                document.querySelector("#spinner").style.cssText = "visibility:hidden;";
            },

            /**
             * 사용자 질문 HTML 생성
             * --------------------------------------------------
             * ✔ 사용자의 입력을 화면에 먼저 표시
             * ✔ prepend() → 최신 메시지를 상단에 배치
             */
            makeQuestionHtml:function(question){
                const questionArea = document.createElement("div");
                questionArea.innerHTML = `
            <div class="d-flex justify-content-between">
                <p class="small mb-1">User</p>
                <p class="small mb-1 text-muted">`+new Date().toLocaleTimeString('ko-kr')+`</p>
            </div>
            <div class="d-flex flex-row justify-content-start">
                <img src="/imgs/user.jpg"
                     alt="User" style="width: 45px; height: 100%;">
                <div>
                    <p class="small p-2 ms-3 mb-3 rounded-3 bg-body-tertiary bg-warning">`
                    +question+`</p>
                </div>
            </div>
        `;
                document.querySelector('#result').prepend(questionArea);
            },

            /**
             * 응답 HTML 생성
             * --------------------------------------------------
             * ✔ 스트리밍 데이터를 출력할 <pre> 영역 생성
             * ✔ 고유 ID 생성 후 리턴
             *
             * ✔ crypto.getRandomValues()
             *   - 충돌 방지를 위한 랜덤 ID 생성
             */
            makeResponseHtml: async function(){

                let targetId = "target-" + crypto.getRandomValues(new Uint32Array(10));

                const responseArea = document.createElement("div");
                responseArea.innerHTML = `
            <div class="d-flex justify-content-between">
                <p class="small mb-1 text-muted">`+new Date().toLocaleTimeString('ko-kr')+`</p>
                <p class="small mb-1">Chatbot</p>
            </div>
            <div class="d-flex flex-row justify-content-end mb-4 pt-1">
                <div class="small p-2 me-3 mb-3 rounded-3 bg-info" style="overflow: auto">
                    <pre class="text-white" style="font-weight: bold" id="`+targetId+`"></pre>
                </div>
                <img src="/imgs/chatbot.png"
                     alt="Chat Bot" style="width: 45px; height: 100%;">
            </div>
        `;

                document.querySelector('#result').prepend(responseArea);

                return targetId;
            },

            /**
             * 메시지 전송 함수
             * ============================================================
             * ✔ 사용자 입력 수집
             * ✔ fetch POST 요청
             * ✔ 스트리밍 응답 처리 시작
             */
            send:async function(){

                document.querySelector('#spinner').style.cssText = "visibility:visible;";

                let question = document.querySelector('#question').value;
                let type = document.querySelector('#type').value;

                // 사용자 질문 먼저 출력 (UX 향상)
                this.makeQuestionHtml(type+":"+question);

                /**
                 * fetch 요청
                 * --------------------------------------------------
                 * Content-Type: application/x-www-form-urlencoded
                 * → 서버에 key=value 형태로 전달
                 *
                 * ※ 스트리밍의 경우 Accept 헤더를 NDJSON으로 설정 가능
                 */
                const response = await fetch(this.url, {
                    method: "post",
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        // 'Accept': 'application/x-ndjson'
                    },
                    body: new URLSearchParams({
                        prompt: question,
                        type:type
                    })
                });

                // 스트리밍 출력용 HTML 생성
                const targetId = await this.makeResponseHtml();

                // 스트리밍 응답 처리 시작
                await this.responseDisplay(targetId, response);
            },

            /**
             * 스트리밍 응답 출력 로직 (핵심)
             * ============================================================
             * ✔ response.body → ReadableStream
             * ✔ getReader() → 스트림을 chunk 단위로 읽기
             * ✔ TextDecoder → 바이너리 → 문자열 변환
             *
             * ✔ while(true) 루프:
             *   - 서버가 데이터를 계속 보내는 동안 반복
             */
            responseDisplay:async function(targetId, response) {

                const target = document.getElementById(targetId);

                // 스트림 reader 생성
                const reader = response.body.getReader();

                // UTF-8 디코더
                const decoder = new TextDecoder("utf-8");

                while (true) {

                    // 서버에서 chunk 읽기
                    const {value, done} = await reader.read();

                    if (done) break; // 스트림 종료

                    // 바이너리 데이터를 문자열로 변환
                    let ch = decoder.decode(value);

                    console.log(ch);

                    /**
                     * append(document.createTextNode())
                     * --------------------------------------------------
                     * ✔ innerHTML 사용 X (보안상 안전)
                     * ✔ 실시간으로 텍스트 누적 출력
                     */
                    target.append(document.createTextNode(ch));
                }

                // 스트림 종료 후 스피너 숨김
                document.querySelector("#spinner").style.cssText = "visibility:hidden;";
            }
        }

        /**
         * DOM 로딩 완료 후 초기화 실행
         */
        window.onload = function(){
            multi_llm_stream.init();
        }

    </script>


    <div class="col-sm-10">
        <h2 class="text-center">2. Multi LLM - Reactive Streams</h2>
        <div class="container py-5">

            <div class="row d-flex justify-content-center">
                <div class="col-sm-10">
                    <button class="btn btn-primary" disabled id="spinner">
                        <span class="spinner-border spinner-border-sm" ></span>
                        Loading..
                    </button>
                    <div class="row justify-content-center">
                        <div class="col-sm-5">
                            <div class="input-group p-1">
                                <span class="input-group-text">구분</span>
                                <select id="type" class="form-control">
                                    <option value="openai" selected>OpenAI</option>
                                    <option value="gemini">Gemini</option>
                                    <option value="llama">Llama</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header text-muted d-flex justify-content-start align-items-center p-3">
                            <div class="input-group mb-0">
                                <input  id="question" type="text" class="form-control" placeholder="Type message" value="서울의 맛집 알려줘"
                                        aria-label="Recipient's username" aria-describedby="button-addon2" />
                                <button type="button" class="btn btn-primary" id="send_btn">Send</button>
                            </div>
                        </div>
                        <div id="result" class="card-body" data-mdb-perfect-scrollbar-init >


                        </div> <!-- end result -->
                    </div> <!-- end card -->
                </div>
            </div>
        </div>
    </div>

</th:block>

</html>
