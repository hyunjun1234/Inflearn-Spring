<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">



<th:block>
    <script>
        /*
         * voting_analysis 객체
         *
         * ✔ 목적
         * - 하나의 질문에 대해 여러 LLM 또는 Agent가 각각 답변 생성
         * - 그 결과를 종합하여 Voting(합의/평가/선정) 수행
         * - 최종 선택된 결과를 사용자에게 제공
         *
         * ✔ 강의 핵심 개념
         * 1. Multi-LLM Voting Architecture
         * 2. SSE 기반 단계별 상태 모니터링
         * 3. NDJSON 스트리밍 응답 처리
         * 4. workflowId 기반 분산 실행 추적
         *
         * 👉 Strategic / Precision 단계와의 차이:
         * - Strategic: 분석 중심
         * - Precision: 실행 중심
         * - Voting: 다중 모델 합의 기반 의사결정
         */

        voting_analysis = {

            // Voting 분석 요청 엔드포인트
            url:'/ch3/voting-analysis',

            // 워크플로우 상태 스트리밍용 SSE 엔드포인트
            sseUrl: '/api/workflow/stream/',

            /*
             * 초기화
             * - 버튼 이벤트 연결
             * - 로딩 스피너 숨김
             */
            init:function(){
                document.querySelector("#send_btn").addEventListener("click", ()=>{
                    this.send();
                })
                document.querySelector("#spinner").style.cssText = "visibility:hidden;";
            },

            /*
             * 사용자 질문 UI 생성
             */
            makeQuestionHtml:function(question){

            },

            /*
             * 응답 출력 영역 생성
             * - Streaming 데이터가 append될 공간 확보
             */
            makeResponseHtml: async function(){

            },

            /*
             * 메인 실행 흐름
             *
             * 실행 순서:
             * 1. 질문 출력
             * 2. workflowId 생성
             * 3. SSE 연결 (각 모델 실행 상태 수신)
             * 4. Voting 분석 요청
             * 5. 스트리밍 응답 출력
             */
            send:async function(){

            },

            /*
             * 상태 로그 UI 생성
             * - 각 LLM의 실행 단계 표시
             */
            makeStatusArea: function(workflowId) {

            },

            /*
             * SSE 연결
             *
             * ✔ 서버 → 클라이언트 실시간 이벤트 스트림
             * ✔ Multi-Model 실행 상태 수신
             * ✔ Voting 단계 로그 표시
             */
            connectSSE: async function(workflowId) {

            },

            /*
             * NDJSON 스트리밍 응답 출력
             *
             * ✔ reader.read() 반복
             * ✔ chunk 단위 디코딩
             * ✔ Voting 결과가 점진적으로 표시
             */
            responseDisplay:async function(targetId, response) {

            }
        }

        // 페이지 로드시 초기화
        window.onload = function(){
            voting_analysis.init();
        }
    </script>


    <div class="col-sm-10">
        <h2 class="text-center">3. Voting Analysis</h2>
        <div class="container py-5">

            <div class="row d-flex justify-content-center">
                <div class="col-sm-10">
                    <button class="btn btn-primary" disabled id="spinner">
                        <span class="spinner-border spinner-border-sm" ></span>
                        Loading..
                    </button>
                    <div class="card">
                        <div class="card-header text-muted d-flex justify-content-start align-items-center p-3">
                            <div class="input-group mb-0">
                                <input  id="question" type="text" class="form-control" placeholder="Type message" value="향후 5년간 고체 배터리 시장의 연평균 성장률(CAGR) 예측치와 주요 리스크 3가지를 알려줘."
                                        aria-label="Recipient's username" aria-describedby="button-addon2" />
                                <button type="button" class="btn btn-primary" id="send_btn">Send</button>
                            </div>
                        </div>
                        <div id="result" class="card-body" data-mdb-perfect-scrollbar-init >


                        </div> <!-- end result -->
                    </div> <!-- end card -->
                </div>
            </div>
        </div>
    </div>

</th:block>

</html>
